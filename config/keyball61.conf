# --- 既存のBluetooth・システム設定 ---
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# 送信電力を最大に設定（接続を安定させるため）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# --- マウス・トラックボール用設定（ここが重要！） ---
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y
CONFIG_SPI=y

# PMW3610 センサーの有効化
CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=1200
CONFIG_PMW3610_ORIENTATION_180=n

# オートマウス（ボールを動かすと自動でレイヤー切替）の設定
# ※今回はキーマップ側で制御するため、一旦 0 (オフ) にしておきます
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=0

# トラックボールを左側に配置していることを明示
CONFIG_KEYBALL_TRACKBALL_IS_LEFT=y

# 省電力設定（お好みで。15分でスリープ）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
