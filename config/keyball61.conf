# Bluetoothの接続安定化
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# スリープ設定
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# マウス機能とポインティングの基本有効化
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y
CONFIG_SPI=y

# ディスプレイ設定
CONFIG_ZMK_DISPLAY=y

# ZMK Studioを一旦オフ（ビルド成功を優先）
CONFIG_ZMK_STUDIO=y
